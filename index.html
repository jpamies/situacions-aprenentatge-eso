<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Situacions d'aprenentatge ESO</title>
  <meta name="description" content="Generador de situacions d'aprenentatge per a l'ESO (Tecnologia i Digitalització, Tecnologia, Digitalització) segons el Decret 175/2022.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230f766e'/><path d='M18 44V20h12a8 8 0 0 1 0 16h-6m10 8 10-24 10 24m-16-7h12' stroke='white' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/doc.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">SA</span>
      <div>
        <h1 data-i18n="appTitle"></h1>
        <p class="sub" data-i18n="appSubtitle"></p>
      </div>
    </div>
    <div class="top-actions">
    <button type="button" id="aiBtn" class="ai-toggle">✨ IA</button>
    <div class="lang" role="group" aria-label="Idioma / Idioma">
      <button type="button" data-lang="ca">CA</button>
      <button type="button" data-lang="es">ES</button>
    </div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="generate" data-i18n="tabGenerate"></button>
    <button role="tab" data-tab="prog" data-i18n="tabProg"></button>
    <button role="tab" data-tab="saved" data-i18n="tabSaved"></button>
    <button role="tab" data-tab="about" data-i18n="tabAbout"></button>
  </nav>

  <main>
    <section id="view-generate" class="view">
      <form id="form" class="panel form" autocomplete="off"></form>
      <div class="output">
        <div class="toolbar" id="toolbar" hidden>
          <button type="button" class="primary" data-act="save"></button>
          <button type="button" data-act="print"></button>
          <button type="button" data-act="html"></button>
          <button type="button" data-act="md"></button>
          <button type="button" data-act="prompt"></button>
          <button type="button" data-act="new"></button>
          <span class="status" id="status" aria-live="polite"></span>
        </div>
        <div class="ai-tools" id="aiTools" hidden>
          <button type="button" class="ai-btn" data-ai="rubric"></button>
          <button type="button" class="ai-btn" data-ai="activities"></button>
          <button type="button" class="ai-btn" data-ai="review"></button>
        </div>
        <div id="aiOut" aria-live="polite"></div>
        <div id="coherence" class="coherence" hidden></div>
        <p class="hint" id="editHint" hidden></p>
        <article id="doc" class="sa-doc empty"></article>
      </div>
    </section>

    <section id="view-prog" class="view" hidden>
      <div class="prog-layout">
        <aside class="panel form" id="progSettings"></aside>
        <div id="progMain" class="prog-main"></div>
      </div>
    </section>

    <section id="view-saved" class="view" hidden>
      <div class="panel">
        <div class="saved-head">
          <h2 data-i18n="savedTitle"></h2>
          <div class="saved-actions">
            <button type="button" id="exportAll" data-i18n="exportAll"></button>
            <label class="btn"><span data-i18n="importAll"></span><input type="file" id="importFile" accept="application/json" hidden></label>
          </div>
        </div>
        <ul id="savedList" class="saved-list"></ul>
      </div>
    </section>

    <section id="view-about" class="view" hidden>
      <div class="panel prose" id="about"></div>
    </section>
  </main>

  <dialog id="aiDialog" class="ai-dialog"></dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
